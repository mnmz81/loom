<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-labelledby="t d">
<title id="t">Contributing to someone else's project with a fork</title>
<desc id="d">The original repository is called upstream. You fork it on GitHub to get your own copy, clone the fork to your computer, push your branch to the fork, and open a pull request from the fork back to upstream. git fetch upstream brings new upstream commits to your computer.</desc>
<defs><marker id="ah-f8fafc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f8fafc"/></marker><marker id="ah-cbd5e1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#cbd5e1"/></marker><marker id="ah-0f172a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f172a"/></marker><marker id="ah-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="ah-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker><marker id="ah-db2777" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#db2777"/></marker><marker id="ah-16a34a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16a34a"/></marker><marker id="ah-dc2626" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#dc2626"/></marker><marker id="ah-d97706" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d97706"/></marker><marker id="ah-94a3b8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker><marker id="ah-e2e8f0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e2e8f0"/></marker></defs>
<rect width="760" height="330" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
<rect x="285" y="20" width="190" height="86" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<text x="380" y="52" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#2563eb" font-weight="700" text-anchor="middle">upstream</text>
<text x="380" y="72" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle">the original project</text>
<text x="380" y="90" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle">on GitHub, not yours</text>
<rect x="40" y="190" width="210" height="96" rx="10" fill="#ffffff" stroke="#db2777" stroke-width="1.5"/>
<text x="145" y="222" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#db2777" font-weight="700" text-anchor="middle">your fork</text>
<text x="145" y="242" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle">your copy on GitHub</text>
<text x="145" y="260" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle">you can push here</text>
<rect x="510" y="190" width="210" height="96" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
<text x="615" y="222" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#16a34a" font-weight="700" text-anchor="middle">your computer</text>
<text x="615" y="242" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle">the local clone</text>
<text x="615" y="260" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle">where you edit</text>
<line x1="300" y1="108" x2="141.78885438199984" y2="187.10557280900008" stroke="#db2777" stroke-width="2" marker-end="url(#ah-db2777)"/>
<text x="190" y="134" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#db2777" font-weight="400" text-anchor="end">Fork</text>
<line x1="222" y1="188" x2="343.3171986722004" y2="110.08082361704203" stroke="#d97706" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah-d97706)"/>
<text x="300" y="178" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#d97706" font-weight="400" text-anchor="start">Pull request</text>
<line x1="254" y1="218" x2="504" y2="218" stroke="#16a34a" stroke-width="2" marker-end="url(#ah-16a34a)"/>
<text x="380" y="208" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#16a34a" font-weight="400" text-anchor="middle">git clone</text>
<line x1="506" y1="262" x2="256" y2="262" stroke="#2563eb" stroke-width="2" marker-end="url(#ah-2563eb)"/>
<text x="380" y="282" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#2563eb" font-weight="400" text-anchor="middle">git push</text>
<line x1="440" y1="108" x2="578.2635137157511" y2="187.00772212328633" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah-94a3b8)"/>
<text x="530" y="134" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#64748b" font-weight="400" text-anchor="start">git fetch upstream</text>
<text x="380" y="316" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#64748b" font-weight="400" text-anchor="middle">Keep the fork current with upstream, then branch from it for each change</text>
</svg>
