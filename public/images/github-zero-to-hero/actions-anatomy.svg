<text x="635" y="120" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="middle">runs on a runner</text>
<rect x="542" y="134" width="186" height="26" rx="6" fill="#e2e8f0"/>
<text x="552" y="152" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#0f172a" font-weight="400" text-anchor="start">uses: actions/checkout</text>
