<svg xmlns="http://www.w3.org/2000/svg" width="780" height="300" viewBox="0 0 780 300" role="img" aria-labelledby="t d">
<title id="t">How a GitHub Actions workflow is built</title>
<desc id="d">An event such as a push or a pull request triggers a workflow, which is a YAML file in .github/workflows. The workflow has jobs. Each job runs on a runner and consists of steps. A job can wait for another with needs.</desc>
