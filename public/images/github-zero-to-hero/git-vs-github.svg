<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-labelledby="t d">
<title id="t">Git and GitHub</title>
<desc id="d">Git runs on your computer and keeps the repository history. GitHub hosts a copy of the repository online. git push uploads commits to GitHub, and git fetch or git pull downloads them. On top of the hosted repository GitHub adds issues, pull requests, Actions, Pages, projects and releases.</desc>
