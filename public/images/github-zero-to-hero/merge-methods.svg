<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" role="img" aria-labelledby="t d">
<title id="t">Three ways to merge a pull request</title>
<desc id="d">The pull request branch has three commits C, D and E on top of main commit B. Merge commit keeps C, D and E and adds a merge commit M with two parents. Squash and merge turns C, D and E into one new commit S. Rebase and merge copies C, D and E onto main as C prime, D prime and E prime with no merge commit.</desc>
<defs><marker id="ah-f8fafc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f8fafc"/></marker><marker id="ah-cbd5e1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#cbd5e1"/></marker><marker id="ah-0f172a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f172a"/></marker><marker id="ah-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="ah-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker><marker id="ah-db2777" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#db2777"/></marker><marker id="ah-16a34a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16a34a"/></marker><marker id="ah-dc2626" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#dc2626"/></marker><marker id="ah-d97706" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d97706"/></marker><marker id="ah-94a3b8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker><marker id="ah-e2e8f0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e2e8f0"/></marker></defs>
<rect width="760" height="400" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="380" y="28" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#64748b" font-weight="400" text-anchor="middle">Same pull request: C, D, E on a branch, main is at B. Result on main:</text>
<text x="24" y="98" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#0f172a" font-weight="700" text-anchor="start">Merge commit</text>
<text x="24" y="118" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">keeps every commit + a merge</text>
<circle cx="300" cy="110" r="17" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><text x="300" y="115" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">A</text>
<line x1="351" y1="110" x2="321" y2="110" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah-94a3b8)"/>
<circle cx="370" cy="110" r="17" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><text x="370" y="115" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">B</text>
<circle cx="600" cy="110" r="17" fill="#16a34a" stroke="#16a34a" stroke-width="2"/><text x="600" y="115" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">M</text>
<line x1="583" y1="110" x2="391" y2="110" stroke="#16a34a" stroke-width="2" marker-end="url(#ah-16a34a)"/>
<circle cx="430" cy="56" r="17" fill="#db2777" stroke="#db2777" stroke-width="2"/><text x="430" y="61" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">C</text>
<line x1="471" y1="56" x2="451" y2="56" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah-94a3b8)"/>
<circle cx="490" cy="56" r="17" fill="#db2777" stroke="#db2777" stroke-width="2"/><text x="490" y="61" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">D</text>
<line x1="531" y1="56" x2="511" y2="56" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah-94a3b8)"/>
<circle cx="550" cy="56" r="17" fill="#db2777" stroke="#db2777" stroke-width="2"/><text x="550" y="61" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">E</text>
<line x1="413" y1="63" x2="383.2844397252208" y2="98.46695903763967" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah-94a3b8)"/>
<line x1="583" y1="100" x2="567.8515940726597" y2="67.80963740440198" stroke="#16a34a" stroke-width="2" marker-end="url(#ah-16a34a)"/>
<text x="680" y="114" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle">two parents</text>
<line x1="20" y1="158" x2="740" y2="158" stroke="#cbd5e1"/>
<text x="24" y="228" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#0f172a" font-weight="700" text-anchor="start">Squash and merge</text>
<text x="24" y="248" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">one new commit for the PR</text>
<circle cx="300" cy="240" r="17" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><text x="300" y="245" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">A</text>
<line x1="351" y1="240" x2="321" y2="240" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah-94a3b8)"/>
<circle cx="370" cy="240" r="17" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><text x="370" y="245" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">B</text>
<line x1="421" y1="240" x2="391" y2="240" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah-94a3b8)"/>
<circle cx="440" cy="240" r="17" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><text x="440" y="245" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">S</text>
<text x="530" y="244" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">S = C + D + E in one commit</text>
<line x1="20" y1="288" x2="740" y2="288" stroke="#cbd5e1"/>
<text x="24" y="338" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#0f172a" font-weight="700" text-anchor="start">Rebase and merge</text>
<text x="24" y="358" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">copies each commit, no merge</text>
<circle cx="300" cy="350" r="17" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><text x="300" y="355" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">A</text>
<line x1="351" y1="350" x2="321" y2="350" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah-94a3b8)"/>
<circle cx="370" cy="350" r="17" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><text x="370" y="355" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">B</text>
<line x1="421" y1="350" x2="391" y2="350" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah-94a3b8)"/>
<circle cx="440" cy="350" r="17" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><text x="440" y="355" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">C′</text>
<line x1="491" y1="350" x2="461" y2="350" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah-94a3b8)"/>
<circle cx="510" cy="350" r="17" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><text x="510" y="355" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">D′</text>
<line x1="561" y1="350" x2="531" y2="350" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah-94a3b8)"/>
<circle cx="580" cy="350" r="17" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><text x="580" y="355" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">E′</text>
<text x="680" y="354" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle">new hashes</text>
</svg>
