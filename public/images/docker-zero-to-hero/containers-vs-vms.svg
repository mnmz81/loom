<rect x="405" y="290" width="325" height="34" rx="8" fill="#94a3b8"/><text x="567.5" y="312" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#ffffff" font-weight="600" text-anchor="middle">Hardware</text>
<rect x="405" y="248" width="325" height="34" rx="8" fill="#64748b"/><text x="567.5" y="270" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#ffffff" font-weight="600" text-anchor="middle">Host OS  (one shared kernel)</text>
