<rect x="629" y="62" width="87" height="40" rx="8" fill="#2563eb"/><text x="672.5" y="87" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#ffffff" font-weight="600" text-anchor="middle">App</text>
<rect x="629" y="108" width="87" height="34" rx="8" fill="#e2e8f0"/><text x="672.5" y="130" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#0f172a" font-weight="600" text-anchor="middle">Libraries</text>
<text x="380" y="350" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#64748b" font-weight="400" text-anchor="middle">Containers share the host kernel: they start in moments and take far less space.</text>
