<rect x="521" y="108" width="87" height="34" rx="8" fill="#e2e8f0"/><text x="564.5" y="130" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#0f172a" font-weight="600" text-anchor="middle">Libraries</text>
