<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-labelledby="t d">
<title id="t">Containers compared with virtual machines</title>
<desc id="d">A virtual machine stack has hardware, a host operating system with a hypervisor, and then several virtual machines, each with its own guest operating system, libraries and app. A container stack has hardware, a host operating system, the Docker Engine, and then several containers that only hold libraries and an app and share the host kernel.</desc>
