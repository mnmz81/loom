<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320" role="img" aria-labelledby="t d">
<title id="t">From Dockerfile to image to container</title>
<desc id="d">A Dockerfile is built into an image with docker build. docker run starts one or more containers from the image. An image can be pushed to a registry such as Docker Hub with docker push and downloaded again with docker pull.</desc>
<defs><marker id="ah-f8fafc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f8fafc"/></marker><marker id="ah-cbd5e1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#cbd5e1"/></marker><marker id="ah-0f172a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f172a"/></marker><marker id="ah-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="ah-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker><marker id="ah-db2777" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#db2777"/></marker><marker id="ah-16a34a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16a34a"/></marker><marker id="ah-dc2626" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#dc2626"/></marker><marker id="ah-d97706" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d97706"/></marker><marker id="ah-94a3b8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker><marker id="ah-e2e8f0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e2e8f0"/></marker></defs>
<rect width="760" height="320" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
<rect x="20" y="100" width="120" height="80" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="80" y="136" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#0f172a" font-weight="700" text-anchor="middle">Dockerfile</text>
<text x="80" y="156" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle">the recipe</text>
<line x1="142" y1="140" x2="256" y2="140" stroke="#2563eb" stroke-width="2" marker-end="url(#ah-2563eb)"/>
<text x="200" y="128" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#2563eb" font-weight="400" text-anchor="middle">docker build</text>
<rect x="260" y="100" width="120" height="80" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<text x="320" y="136" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#2563eb" font-weight="700" text-anchor="middle">Image</text>
<text x="320" y="156" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle">read-only</text>
<line x1="382" y1="125" x2="496.0763275639772" y2="92.54725164128234" stroke="#16a34a" stroke-width="2" marker-end="url(#ah-16a34a)"/>
<line x1="382" y1="155" x2="496.02113752632846" y2="171.7099942926516" stroke="#16a34a" stroke-width="2" marker-end="url(#ah-16a34a)"/>
<text x="440" y="143" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#16a34a" font-weight="400" text-anchor="middle">docker run</text>
<rect x="500" y="64" width="150" height="56" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
<text x="575" y="88" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#16a34a" font-weight="700" text-anchor="middle">Container 1</text>
<text x="575" y="106" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle">running</text>
<rect x="500" y="144" width="150" height="56" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
<text x="575" y="168" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#16a34a" font-weight="700" text-anchor="middle">Container 2</text>
<text x="575" y="186" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle">running</text>
<rect x="260" y="236" width="120" height="56" rx="10" fill="#ffffff" stroke="#db2777" stroke-width="1.5"/>
<text x="320" y="260" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#db2777" font-weight="700" text-anchor="middle">Registry</text>
<text x="320" y="278" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="middle">e.g. Docker Hub</text>
<line x1="300" y1="182" x2="300" y2="232" stroke="#db2777" stroke-width="2" marker-end="url(#ah-db2777)"/>
<text x="292" y="213" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#db2777" font-weight="400" text-anchor="end">docker push</text>
<line x1="340" y1="234" x2="340" y2="186" stroke="#db2777" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah-db2777)"/>
<text x="348" y="213" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#db2777" font-weight="400" text-anchor="start">docker pull</text>
<text x="575" y="252" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#64748b" font-weight="400" text-anchor="middle">One image can start</text>
<text x="575" y="270" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#64748b" font-weight="400" text-anchor="middle">as many containers as you like</text>
