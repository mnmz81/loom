<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" role="img" aria-labelledby="t d">
<title id="t">Publishing ports and container networks</title>
<desc id="d">Your browser reaches the web container through a published port, 8080 on the host mapped to 3000 in the container. The web and db containers sit on the same user-defined network, so web reaches the database by its name, db, on port 5432. The database port is not published, so nothing outside can reach it.</desc>
<defs><marker id="ah-f8fafc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f8fafc"/></marker><marker id="ah-cbd5e1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#cbd5e1"/></marker><marker id="ah-0f172a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f172a"/></marker><marker id="ah-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="ah-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker><marker id="ah-db2777" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#db2777"/></marker><marker id="ah-16a34a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16a34a"/></marker><marker id="ah-dc2626" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#dc2626"/></marker><marker id="ah-d97706" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d97706"/></marker><marker id="ah-94a3b8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker><marker id="ah-e2e8f0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e2e8f0"/></marker></defs>
<rect width="760" height="340" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
<rect x="20" y="20" width="720" height="270" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="100" y="44" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#64748b" font-weight="400" text-anchor="middle">Your computer (host)</text>
<rect x="30" y="115" width="130" height="90" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="95" y="152" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#0f172a" font-weight="700" text-anchor="middle">Browser</text>
<text x="95" y="174" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle">localhost:8080</text>
<rect x="290" y="56" width="430" height="220" rx="10" fill="#f8fafc" stroke="#16a34a" stroke-width="1.5"/>
<text x="505" y="80" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#16a34a" font-weight="600" text-anchor="middle">user-defined network</text>
<line x1="162" y1="160" x2="306" y2="160" stroke="#2563eb" stroke-width="2" marker-end="url(#ah-2563eb)"/>
<text x="228" y="148" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#2563eb" font-weight="400" text-anchor="middle">-p 8080:3000</text>
<rect x="310" y="110" width="140" height="100" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<text x="380" y="148" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#2563eb" font-weight="700" text-anchor="middle">web</text>
<text x="380" y="170" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle">listens on :3000</text>
<rect x="560" y="110" width="140" height="100" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
<text x="630" y="148" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#d97706" font-weight="700" text-anchor="middle">db</text>
<text x="630" y="170" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle">listens on :5432</text>
<line x1="452" y1="160" x2="556" y2="160" stroke="#16a34a" stroke-width="2" marker-end="url(#ah-16a34a)"/>
<text x="505" y="240" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#16a34a" font-weight="400" text-anchor="middle">web reaches the database as  db:5432</text>
<text x="630" y="196" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#dc2626" font-weight="400" text-anchor="middle">not published</text>
<text x="380" y="322" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#64748b" font-weight="400" text-anchor="middle">Publish only what the outside needs. -p 127.0.0.1:8080:3000 keeps it reachable from this computer only.</text>
</svg>
