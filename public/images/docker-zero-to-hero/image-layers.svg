<svg xmlns="http://www.w3.org/2000/svg" width="760" height="370" viewBox="0 0 760 370" role="img" aria-labelledby="t d">
<title id="t">Image layers and the build cache</title>
<desc id="d">An image is a stack of read-only layers, one per Dockerfile instruction: FROM node:24-slim, WORKDIR, COPY package files, RUN npm ci, COPY of the source. Every container adds its own thin read-write layer on top. After editing a source file only the COPY of the source is rebuilt, and the layers below it come from the cache.</desc>
<defs><marker id="ah-f8fafc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f8fafc"/></marker><marker id="ah-cbd5e1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#cbd5e1"/></marker><marker id="ah-0f172a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f172a"/></marker><marker id="ah-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="ah-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker><marker id="ah-db2777" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#db2777"/></marker><marker id="ah-16a34a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16a34a"/></marker><marker id="ah-dc2626" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#dc2626"/></marker><marker id="ah-d97706" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d97706"/></marker><marker id="ah-94a3b8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker><marker id="ah-e2e8f0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e2e8f0"/></marker></defs>
<rect width="760" height="370" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
<rect x="40" y="28" width="340" height="40" rx="8" fill="#16a34a" fill-opacity="0.15" stroke="#16a34a" stroke-dasharray="5 4"/>
<text x="56" y="53" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#16a34a" font-weight="600" text-anchor="start">container layer (read-write)</text>
<rect x="460" y="36" width="160" height="24" rx="12" fill="#94a3b8"/><text x="540" y="53" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#ffffff" font-weight="600" text-anchor="middle">new per container</text>
<rect x="40" y="74" width="340" height="40" rx="8" fill="#d97706"/>
<text x="56" y="99" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#ffffff" font-weight="600" text-anchor="start">COPY . .</text>
<rect x="460" y="82" width="160" height="24" rx="12" fill="#d97706"/><text x="540" y="99" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#ffffff" font-weight="600" text-anchor="middle">rebuilt</text>
<rect x="40" y="120" width="340" height="40" rx="8" fill="#2563eb"/>
<text x="56" y="145" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#ffffff" font-weight="600" text-anchor="start">RUN npm ci --omit=dev</text>
<rect x="460" y="128" width="160" height="24" rx="12" fill="#16a34a"/><text x="540" y="145" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#ffffff" font-weight="600" text-anchor="middle">cached</text>
<rect x="40" y="166" width="340" height="40" rx="8" fill="#2563eb"/>
<text x="56" y="191" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#ffffff" font-weight="600" text-anchor="start">COPY package*.json ./</text>
<rect x="460" y="174" width="160" height="24" rx="12" fill="#16a34a"/><text x="540" y="191" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#ffffff" font-weight="600" text-anchor="middle">cached</text>
<rect x="40" y="212" width="340" height="40" rx="8" fill="#2563eb"/>
<text x="56" y="237" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#ffffff" font-weight="600" text-anchor="start">WORKDIR /app</text>
<rect x="460" y="220" width="160" height="24" rx="12" fill="#16a34a"/><text x="540" y="237" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#ffffff" font-weight="600" text-anchor="middle">cached</text>
<rect x="40" y="258" width="340" height="40" rx="8" fill="#64748b"/>
<text x="56" y="283" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#ffffff" font-weight="600" text-anchor="start">FROM node:24-slim</text>
<rect x="460" y="266" width="160" height="24" rx="12" fill="#16a34a"/><text x="540" y="283" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#ffffff" font-weight="600" text-anchor="middle">cached</text>
<text x="210" y="316" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle">read-only image layers (bottom) + one writable layer (top)</text>
<text x="380" y="346" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#64748b" font-weight="400" text-anchor="middle">Edit a source file: only COPY . . and what comes after it run again.</text>
</svg>
