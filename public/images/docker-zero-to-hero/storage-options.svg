<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" role="img" aria-labelledby="t d">
<title id="t">Where a container can keep data</title>
<desc id="d">A container has its own writable layer that disappears when the container is removed. A volume is managed by Docker and survives removal. A bind mount is a folder on your computer that you can edit live. A tmpfs mount lives in memory and is gone when the container stops.</desc>
<defs><marker id="ah-f8fafc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f8fafc"/></marker><marker id="ah-cbd5e1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#cbd5e1"/></marker><marker id="ah-0f172a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f172a"/></marker><marker id="ah-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="ah-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker><marker id="ah-db2777" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#db2777"/></marker><marker id="ah-16a34a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16a34a"/></marker><marker id="ah-dc2626" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#dc2626"/></marker><marker id="ah-d97706" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d97706"/></marker><marker id="ah-94a3b8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker><marker id="ah-e2e8f0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e2e8f0"/></marker></defs>
<rect width="760" height="340" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
<rect x="30" y="30" width="250" height="76" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
<text x="155" y="58" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#16a34a" font-weight="700" text-anchor="middle">Volume</text>
<text x="155" y="78" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle">managed by Docker</text>
<text x="155" y="94" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle">survives removing the container</text>
<rect x="30" y="130" width="250" height="76" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<text x="155" y="158" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#2563eb" font-weight="700" text-anchor="middle">Bind mount</text>
<text x="155" y="178" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle">a folder on your computer</text>
<text x="155" y="194" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle">edit it live, from either side</text>
<rect x="30" y="230" width="250" height="76" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
<text x="155" y="258" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#d97706" font-weight="700" text-anchor="middle">tmpfs</text>
<text x="155" y="278" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle">kept in memory only</text>
<text x="155" y="294" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle">gone when the container stops</text>
<line x1="282" y1="68" x2="546" y2="68" stroke="#16a34a" stroke-width="2" marker-end="url(#ah-16a34a)"/>
<text x="415" y="58" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#16a34a" font-weight="400" text-anchor="middle">-v mydata:/app/data</text>
<line x1="282" y1="168" x2="546" y2="168" stroke="#2563eb" stroke-width="2" marker-end="url(#ah-2563eb)"/>
<text x="415" y="158" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#2563eb" font-weight="400" text-anchor="middle">-v "$(pwd)":/app</text>
<line x1="282" y1="268" x2="546" y2="268" stroke="#d97706" stroke-width="2" marker-end="url(#ah-d97706)"/>
<text x="415" y="258" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#d97706" font-weight="400" text-anchor="middle">--tmpfs /tmp</text>
<rect x="550" y="30" width="190" height="276" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="645" y="138" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#0f172a" font-weight="700" text-anchor="middle">Container</text>
<text x="645" y="162" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle">its own writable layer</text>
<text x="645" y="180" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle">disappears when the</text>
<text x="645" y="198" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle">container is removed</text>
<text x="380" y="324" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#64748b" font-weight="400" text-anchor="middle">Anything that must outlive the container goes in a volume (or a bind mount).</text>
</svg>
