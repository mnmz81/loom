<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="t d">
<title id="t">Reading file permissions</title>
<desc id="d">The ls -l permission string -rwxr-xr-- has a file type character and three triplets: the owner can read, write and execute (7), the group can read and execute (5), and others can only read (4). Together that is the chmod number 754. Read is worth 4, write 2, execute 1.</desc>
<defs><marker id="ah-f8fafc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f8fafc"/></marker><marker id="ah-cbd5e1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#cbd5e1"/></marker><marker id="ah-0f172a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f172a"/></marker><marker id="ah-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="ah-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker><marker id="ah-db2777" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#db2777"/></marker><marker id="ah-16a34a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16a34a"/></marker><marker id="ah-dc2626" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#dc2626"/></marker><marker id="ah-d97706" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d97706"/></marker><marker id="ah-94a3b8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker><marker id="ah-e2e8f0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e2e8f0"/></marker></defs>
<rect width="760" height="300" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="380" y="34" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="16" fill="#0f172a" font-weight="700" text-anchor="middle">-rwxr-xr--  1  alice  dev  4096  Oct 10  deploy.sh</text>
<rect x="30" y="58" width="90" height="120" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="75" y="86" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#0f172a" font-weight="700" text-anchor="middle">Type</text>
<text x="75" y="114" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="26" fill="#0f172a" font-weight="400" text-anchor="middle">-</text>
<text x="75" y="140" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="middle">regular file</text>
<text x="75" y="156" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="middle">(d = directory,</text>
<text x="75" y="170" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="middle">l = link)</text>
<rect x="130" y="58" width="170" height="120" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<text x="215" y="86" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#2563eb" font-weight="700" text-anchor="middle">Owner</text>
<text x="215" y="120" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="28" fill="#0f172a" font-weight="700" text-anchor="middle">rwx</text>
<text x="215" y="152" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#64748b" font-weight="400" text-anchor="middle">4 + 2 + 1 = 7</text>
<rect x="310" y="58" width="170" height="120" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
<text x="395" y="86" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#16a34a" font-weight="700" text-anchor="middle">Group</text>
<text x="395" y="120" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="28" fill="#0f172a" font-weight="700" text-anchor="middle">r-x</text>
<text x="395" y="152" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#64748b" font-weight="400" text-anchor="middle">4 + 0 + 1 = 5</text>
<rect x="490" y="58" width="170" height="120" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
<text x="575" y="86" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#d97706" font-weight="700" text-anchor="middle">Others</text>
<text x="575" y="120" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="28" fill="#0f172a" font-weight="700" text-anchor="middle">r--</text>
<text x="575" y="152" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#64748b" font-weight="400" text-anchor="middle">4 + 0 + 0 = 4</text>
<rect x="690" y="58" width="50" height="120" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="715" y="120" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="20" fill="#0f172a" font-weight="700" text-anchor="middle">754</text>
<text x="715" y="146" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="middle">chmod</text>
<text x="380" y="214" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#0f172a" font-weight="400" text-anchor="middle">r = read (4)     w = write (2)     x = execute (1)     - = not granted</text>
<text x="380" y="244" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#64748b" font-weight="400" text-anchor="middle">On a directory, x means "may enter it and reach the files inside".</text>
<text x="380" y="266" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#64748b" font-weight="400" text-anchor="middle">chmod 754 deploy.sh   or   chmod u=rwx,g=rx,o=r deploy.sh</text>
</svg>
