<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-labelledby="t d">
<title id="t">Five workflow patterns</title>
<desc id="d">Prompt chaining: calls in sequence with a check between them. Routing: a classifier sends the input to one of several handlers. Parallelization: several calls run at once and the results are combined. Orchestrator-workers: a lead model splits the task and delegates to workers. Evaluator-optimizer: one model writes, another evaluates, in a loop.</desc>
