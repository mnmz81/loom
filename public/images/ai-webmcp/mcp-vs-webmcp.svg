<text x="575" y="144" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#db2777" font-weight="400" text-anchor="middle">document.modelContext.registerTool()</text>
<rect x="425" y="186" width="140" height="50" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<text x="495" y="216" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#2563eb" font-weight="700" text-anchor="middle">Browser agent</text>
<line x1="510" y1="184" x2="538.2352941176471" y2="168.94117647058823" stroke="#2563eb" stroke-width="2" marker-end="url(#ah-2563eb)"/>
<text x="600" y="200" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="start">calls a tool:</text>
<text x="600" y="216" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="start">JS runs in the page,</text>
