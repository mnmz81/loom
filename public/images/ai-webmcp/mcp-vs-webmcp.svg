<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-labelledby="t d">
<title id="t">MCP compared with WebMCP</title>
<desc id="d">With MCP, an agent host connects to a separate MCP server process, which calls your backend API with its own credentials. With WebMCP, the web page itself registers tools with document.modelContext.registerTool. An agent in the browser calls a tool, the tool runs as JavaScript inside the open page, using the page code and the user session, and the user watches the page update.</desc>
