<svg xmlns="http://www.w3.org/2000/svg" width="760" height="200" viewBox="0 0 760 200" role="img" aria-labelledby="t d">
<title id="t">Guardrail layers</title>
<desc id="d">A request passes through input checks (screening, validation and rate limits), then the model with its prompt and policy, then output checks (schema, personal data, grounding), and finally action checks (permissions and human confirmation) before anything reaches the user or the outside world. Each layer can block or fall back.</desc>
<defs><marker id="ah-f8fafc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f8fafc"/></marker><marker id="ah-cbd5e1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#cbd5e1"/></marker><marker id="ah-0f172a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f172a"/></marker><marker id="ah-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="ah-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker><marker id="ah-db2777" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#db2777"/></marker><marker id="ah-16a34a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16a34a"/></marker><marker id="ah-dc2626" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#dc2626"/></marker><marker id="ah-d97706" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d97706"/></marker><marker id="ah-94a3b8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker><marker id="ah-e2e8f0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e2e8f0"/></marker></defs>
<rect width="760" height="200" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="30" y="100" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#0f172a" font-weight="700" text-anchor="start">User</text>
<line x1="70" y1="95" x2="94" y2="95" stroke="#64748b" stroke-width="2" marker-end="url(#ah-64748b)"/>
<rect x="100" y="60" width="138" height="70" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
<text x="169" y="90" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#d97706" font-weight="700" text-anchor="middle">Input checks</text>
<text x="169" y="112" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="middle">screen, validate, limit</text>
<line x1="238" y1="95" x2="256" y2="95" stroke="#64748b" stroke-width="2" marker-end="url(#ah-64748b)"/>
<rect x="258" y="60" width="138" height="70" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<text x="327" y="90" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#2563eb" font-weight="700" text-anchor="middle">Model</text>
<text x="327" y="112" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="middle">prompt + policy</text>
<line x1="396" y1="95" x2="414" y2="95" stroke="#64748b" stroke-width="2" marker-end="url(#ah-64748b)"/>
<rect x="416" y="60" width="138" height="70" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
<text x="485" y="90" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#d97706" font-weight="700" text-anchor="middle">Output checks</text>
<text x="485" y="112" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="middle">schema, PII, grounding</text>
<line x1="554" y1="95" x2="572" y2="95" stroke="#64748b" stroke-width="2" marker-end="url(#ah-64748b)"/>
<rect x="574" y="60" width="138" height="70" rx="10" fill="#ffffff" stroke="#db2777" stroke-width="1.5"/>
<text x="643" y="90" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#db2777" font-weight="700" text-anchor="middle">Action checks</text>
<text x="643" y="112" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="middle">permissions, confirm</text>
<text x="380" y="34" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#64748b" font-weight="400" text-anchor="middle">Each layer can block, fix, or fall back to a safe answer.</text>
<text x="380" y="170" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#64748b" font-weight="400" text-anchor="middle">No single layer is enough; together they make failures rare and small.</text>
</svg>
