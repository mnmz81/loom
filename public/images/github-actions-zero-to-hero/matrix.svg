<text x="56" y="100" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#0f172a" font-weight="400" text-anchor="start">matrix:</text>
<text x="72" y="128" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#0f172a" font-weight="400" text-anchor="start">os: [ubuntu-latest,</text>
<text x="115" y="148" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#0f172a" font-weight="400" text-anchor="start">windows-latest]</text>
<text x="72" y="178" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#0f172a" font-weight="400" text-anchor="start">node: [22, 24, 26]</text>
<text x="145" y="220" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#64748b" font-weight="400" text-anchor="middle">2 x 3 = 6 jobs</text>
