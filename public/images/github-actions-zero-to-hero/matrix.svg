<rect x="610" y="140" width="128" height="56" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/><text x="674" y="164" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#d97706" font-weight="700" text-anchor="middle">node 26</text><text x="674" y="183" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="middle">windows-latest</text>
<text x="540" y="230" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#64748b" font-weight="400" text-anchor="middle">All six start at once (up to max-parallel).</text>
<text x="380" y="284" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#64748b" font-weight="400" text-anchor="middle">One failing combination cancels the rest unless fail-fast: false.</text>
