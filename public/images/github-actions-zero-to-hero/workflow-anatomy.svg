<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-labelledby="t d">
<title id="t">The parts of a GitHub Actions workflow</title>
<desc id="d">An event such as push, pull_request, schedule or workflow_dispatch starts a workflow, a YAML file in .github/workflows. The workflow has jobs. Each job runs on its own fresh runner machine and is a list of steps. A step either runs a shell command with run or uses a reusable action with uses.</desc>
