<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-labelledby="t d">
<title id="t">Deploying with OIDC instead of stored keys</title>
<desc id="d">Instead of storing a long-lived cloud access key as a secret, the job asks GitHub for a short-lived OIDC token that says which repository, branch and workflow it is. The cloud provider checks the token against a trust rule and returns temporary credentials that expire in about an hour.</desc>
<defs><marker id="ah-f8fafc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f8fafc"/></marker><marker id="ah-cbd5e1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#cbd5e1"/></marker><marker id="ah-0f172a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f172a"/></marker><marker id="ah-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="ah-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker><marker id="ah-db2777" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#db2777"/></marker><marker id="ah-16a34a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16a34a"/></marker><marker id="ah-dc2626" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#dc2626"/></marker><marker id="ah-d97706" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d97706"/></marker><marker id="ah-94a3b8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker><marker id="ah-e2e8f0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e2e8f0"/></marker></defs>
<rect width="760" height="330" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
<rect x="20" y="120" width="170" height="90" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
<text x="105" y="150" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#16a34a" font-weight="700" text-anchor="middle">Workflow job</text>
<text x="105" y="170" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle">permissions:</text>
<text x="105" y="188" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle">id-token: write</text>
<rect x="300" y="20" width="170" height="80" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<text x="385" y="52" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#2563eb" font-weight="700" text-anchor="middle">GitHub OIDC</text>
<text x="385" y="74" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle">token provider</text>
<line x1="130" y1="118" x2="296.0894282186173" y2="66.59136745614227" stroke="#2563eb" stroke-width="2" marker-end="url(#ah-2563eb)"/>
<text x="195" y="80" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#2563eb" font-weight="400" text-anchor="end">1. request token</text>
<line x1="318" y1="102" x2="173.89995320589463" y2="149.37535785011684" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah-2563eb)"/>
<text x="270" y="140" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#2563eb" font-weight="400" text-anchor="start">2. signed token</text>
<text x="270" y="156" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="start">repo, branch, workflow</text>
<rect x="560" y="120" width="180" height="90" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
<text x="650" y="150" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#d97706" font-weight="700" text-anchor="middle">Cloud (e.g. AWS)</text>
<text x="650" y="170" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle">trust rule: only</text>
<text x="650" y="188" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle">this repo + main</text>
<line x1="192" y1="196" x2="556" y2="196" stroke="#d97706" stroke-width="2" marker-end="url(#ah-d97706)"/>
<text x="375" y="188" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#d97706" font-weight="400" text-anchor="middle">3. exchange token</text>
<line x1="558" y1="214" x2="194" y2="214" stroke="#16a34a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah-16a34a)"/>
<text x="375" y="232" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#16a34a" font-weight="400" text-anchor="middle">4. temporary credentials (expire in about an hour)</text>
<rect x="230" y="268" width="300" height="24" rx="12" fill="#16a34a"/><text x="380" y="285" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#ffffff" font-weight="600" text-anchor="middle">no long-lived key stored anywhere</text>
</svg>
