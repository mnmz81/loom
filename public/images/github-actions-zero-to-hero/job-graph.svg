<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-labelledby="t d">
<title id="t">Jobs that depend on each other</title>
<desc id="d">lint and three test jobs from a matrix run in parallel. build needs all of them, so it waits until they pass. deploy-staging needs build. deploy-production needs deploy-staging and uses the production environment, which waits for a reviewer to approve before it runs.</desc>
