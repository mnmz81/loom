<text x="480" y="104" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle">makes dist/</text>
<line x1="552" y1="89" x2="596" y2="89" stroke="#2563eb" stroke-width="2" marker-end="url(#ah-2563eb)"/>
<text x="575" y="78" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#2563eb" font-weight="400" text-anchor="middle">upload</text>
