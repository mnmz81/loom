<text x="680" y="220" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="middle">from the run page</text>
<text x="380" y="300" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#64748b" font-weight="400" text-anchor="middle">Cache: may be missing, never required for correctness.</text>
<text x="380" y="322" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#64748b" font-weight="400" text-anchor="middle">Artifact: the actual output of a run (builds, reports, logs).</text>
