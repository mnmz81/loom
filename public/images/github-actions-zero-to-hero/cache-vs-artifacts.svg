<text x="190" y="34" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#16a34a" font-weight="700" text-anchor="middle">Cache: speed up the next run</text>
<rect x="30" y="54" width="140" height="70" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="100" y="84" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#0f172a" font-weight="700" text-anchor="middle">Run #41</text>
<text x="100" y="104" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle">npm ci (slow)</text>
