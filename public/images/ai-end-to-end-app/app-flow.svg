<text x="238" y="168" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#dc2626" font-weight="400" text-anchor="middle">off-topic or harmful:</text>
<text x="238" y="184" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#dc2626" font-weight="400" text-anchor="middle">polite refusal</text>
