<svg xmlns="http://www.w3.org/2000/svg" width="760" height="260" viewBox="0 0 760 260" role="img" aria-labelledby="t d">
<title id="t">One request through the support assistant</title>
<desc id="d">A question is first screened by a small, fast model. If it is on-topic and safe, the closest help-center chunks are retrieved, and the main model answers from them, calling the order-status tool when it needs live data. The reply cites its sources. Every request is logged with latency and token usage, and an eval set runs on every change to the prompt or the code.</desc>
