<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="t d">
<title id="t">How a merge works: three points of comparison</title>
<desc id="d">To merge main and feature, Git finds their common ancestor B, the merge base. It compares B to C and B to D, combines both sets of changes, and records the result as the merge commit M.</desc>
