<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" role="img" aria-labelledby="t d">
<title id="t">Rebase replays your commits on top of main</title>
<desc id="d">Before: feature has commits D and E branching off B, while main moved on to C. After git rebase main: D and E are copied as D prime and E prime on top of C, giving a straight line.</desc>
