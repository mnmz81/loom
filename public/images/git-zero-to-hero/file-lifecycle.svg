<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-labelledby="t d">
<title id="t">The life of a file in Git</title>
<desc id="d">A new file starts as untracked. git add makes it staged. After git commit it is unmodified. Editing makes it modified, and git add stages it again. The cycle repeats.</desc>
<defs><marker id="ah-f8fafc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f8fafc"/></marker><marker id="ah-cbd5e1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#cbd5e1"/></marker><marker id="ah-0f172a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f172a"/></marker><marker id="ah-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="ah-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker><marker id="ah-db2777" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#db2777"/></marker><marker id="ah-16a34a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16a34a"/></marker><marker id="ah-dc2626" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#dc2626"/></marker><marker id="ah-d97706" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d97706"/></marker><marker id="ah-94a3b8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker><marker id="ah-e2e8f0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e2e8f0"/></marker></defs>
<rect width="760" height="330" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
<rect x="515" y="24" width="170" height="64" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
<text x="600" y="52" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#dc2626" font-weight="700" text-anchor="middle">Untracked</text>
<text x="600" y="72" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle">a new file Git does not know</text>
<line x1="600" y1="90" x2="600" y2="144" stroke="#2563eb" stroke-width="2" marker-end="url(#ah-2563eb)"/>
<text x="612" y="122" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#2563eb" font-weight="400" text-anchor="start">git add</text>
<rect x="30" y="150" width="170" height="64" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
<text x="115" y="178" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#16a34a" font-weight="700" text-anchor="middle">Unmodified</text>
<text x="115" y="198" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle">same as the last commit</text>
<rect x="272" y="150" width="170" height="64" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
<text x="357" y="178" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#d97706" font-weight="700" text-anchor="middle">Modified</text>
<text x="357" y="198" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle">edited, not staged yet</text>
<rect x="515" y="150" width="170" height="64" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<text x="600" y="178" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#2563eb" font-weight="700" text-anchor="middle">Staged</text>
<text x="600" y="198" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle">queued for the next commit</text>
<line x1="202" y1="182" x2="268" y2="182" stroke="#d97706" stroke-width="2" marker-end="url(#ah-d97706)"/>
<text x="236" y="172" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#d97706" font-weight="400" text-anchor="middle">edit</text>
<line x1="444" y1="182" x2="511" y2="182" stroke="#2563eb" stroke-width="2" marker-end="url(#ah-2563eb)"/>
<text x="478" y="172" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#2563eb" font-weight="400" text-anchor="middle">git add</text>
<path d="M600 216 L600 270 L115 270 L115 218" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#ah-16a34a)"/>
<text x="358" y="262" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#16a34a" font-weight="400" text-anchor="middle">git commit</text>
<text x="380" y="308" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#64748b" font-weight="400" text-anchor="middle">git status shows each file in one of these states</text>
</svg>
