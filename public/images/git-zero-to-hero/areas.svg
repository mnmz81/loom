<text x="385" y="70" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#0f172a" font-weight="700" text-anchor="middle">Staging area</text>
<text x="650" y="70" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#0f172a" font-weight="700" text-anchor="middle">Repository (.git)</text>
<text x="115" y="92" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle">your files on disk</text>
