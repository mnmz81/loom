<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" role="img" aria-labelledby="t d">
<title id="t">Local and remote repositories</title>
<desc id="d">The remote repository origin has main. git fetch copies new commits into your local origin/main without touching main. git merge or git pull brings them into main. git push sends your main commits to origin.</desc>
