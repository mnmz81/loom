<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" role="img" aria-labelledby="t d">
<title id="t">Fast-forward and merge commit</title>
<desc id="d">Top: when main has not moved, git merge just moves the main pointer forward (fast-forward). Bottom: when both branches have new commits, git merge creates a merge commit M with two parents.</desc>
