<text x="300" y="278" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#ffffff" font-weight="400" text-anchor="middle">C undone</text>
<rect x="390" y="232" width="160" height="62" rx="8" fill="#94a3b8"/>
