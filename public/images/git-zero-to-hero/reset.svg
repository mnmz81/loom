<text x="300" y="176" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#ffffff" font-weight="700" text-anchor="middle">main → B</text>
<text x="300" y="196" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#ffffff" font-weight="400" text-anchor="middle">C undone</text>
