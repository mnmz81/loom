<text x="560" y="66" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#0f172a" font-weight="700" text-anchor="start">git reset HEAD~1</text>
<text x="60" y="135" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#0f172a" font-weight="400" text-anchor="middle"></text>
