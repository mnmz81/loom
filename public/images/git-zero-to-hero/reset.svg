<text x="640" y="258" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#ffffff" font-weight="700" text-anchor="middle">C’s changes</text>
<text x="640" y="278" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#ffffff" font-weight="400" text-anchor="middle">still on disk</text>
<text x="120" y="344" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#0f172a" font-weight="700" text-anchor="middle">--hard</text>
