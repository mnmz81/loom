<text x="120" y="262" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#0f172a" font-weight="700" text-anchor="middle">--mixed</text>
<text x="120" y="282" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle">(the default)</text>
