<text x="470" y="176" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#ffffff" font-weight="700" text-anchor="middle">C’s changes</text>
<text x="470" y="196" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#ffffff" font-weight="400" text-anchor="middle">still staged</text>
<rect x="560" y="150" width="160" height="62" rx="8" fill="#16a34a"/>
<text x="640" y="176" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#ffffff" font-weight="700" text-anchor="middle">C’s changes</text>
