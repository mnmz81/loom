<rect x="402.6" y="8" width="54.8" height="24" rx="12" fill="#2563eb"/><text x="430" y="25" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#ffffff" font-weight="600" text-anchor="middle">main</text>
