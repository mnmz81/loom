<text x="610" y="194" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#d97706" font-weight="700" text-anchor="middle">Tools</text>
<rect x="30" y="226" width="400" height="46" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="230" y="254" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#0f172a" font-weight="600" text-anchor="middle">Several steps, known in advance?</text>
<line x1="430" y1="249" x2="488" y2="249" stroke="#d97706" stroke-width="2" marker-end="url(#ah-d97706)"/>
<text x="460" y="242" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#d97706" font-weight="400" text-anchor="middle">yes</text>
