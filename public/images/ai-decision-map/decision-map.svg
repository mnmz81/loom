<text x="230" y="374" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#0f172a" font-weight="600" text-anchor="middle">Behavior still off, enough good data?</text>
<line x1="430" y1="369" x2="488" y2="369" stroke="#2563eb" stroke-width="2" marker-end="url(#ah-2563eb)"/>
<text x="460" y="362" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#2563eb" font-weight="400" text-anchor="middle">yes</text>
