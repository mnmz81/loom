<rect x="470" y="326" width="170" height="46" rx="8" fill="#d97706"/><text x="555" y="347" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#ffffff" font-weight="600" text-anchor="middle">Database (RDS standby)</text><text x="555" y="363" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#ffffff" font-weight="400" text-anchor="middle">no route from the internet</text>
<line x1="482" y1="246" x2="482" y2="322" stroke="#2563eb" stroke-width="2" marker-end="url(#ah-2563eb)"/>
<text x="380" y="446" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#64748b" font-weight="400" text-anchor="middle">Security groups: the web tier accepts 80/443 from anywhere; the database accepts 5432 only from the web servers.</text>
<text x="380" y="462" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#64748b" font-weight="400" text-anchor="middle">Port 5432 is PostgreSQL; MySQL uses 3306.</text>
</svg>
