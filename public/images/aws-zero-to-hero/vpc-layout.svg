<rect x="405" y="162" width="300" height="100" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="695" y="184" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#0f172a" font-weight="700" text-anchor="end">Public subnet  10.0.1.0/24</text>
<rect x="470" y="198" width="170" height="46" rx="8" fill="#16a34a"/><text x="555" y="219" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#ffffff" font-weight="600" text-anchor="middle">Web server (EC2)</text><text x="555" y="235" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#ffffff" font-weight="400" text-anchor="middle">route to the internet gateway</text>
