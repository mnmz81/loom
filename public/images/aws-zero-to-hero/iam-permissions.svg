<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-labelledby="t d">
<title id="t">How IAM decides a request</title>
<desc id="d">A principal such as a person signed in through IAM Identity Center or a role used by an EC2 instance makes a request. IAM checks the policies: with no matching Allow the request is denied by default, and an explicit Deny always wins. If a policy allows it, the request reaches the resource, for example an S3 bucket.</desc>
<defs><marker id="ah-f8fafc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f8fafc"/></marker><marker id="ah-cbd5e1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#cbd5e1"/></marker><marker id="ah-0f172a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f172a"/></marker><marker id="ah-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="ah-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker><marker id="ah-db2777" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#db2777"/></marker><marker id="ah-16a34a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16a34a"/></marker><marker id="ah-dc2626" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#dc2626"/></marker><marker id="ah-d97706" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d97706"/></marker><marker id="ah-94a3b8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker><marker id="ah-e2e8f0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e2e8f0"/></marker></defs>
<rect width="760" height="330" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
<rect x="20" y="40" width="190" height="120" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<text x="115" y="70" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#2563eb" font-weight="700" text-anchor="middle">Principal</text>
<text x="115" y="94" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle">who is asking</text>
<text x="115" y="118" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#0f172a" font-weight="400" text-anchor="middle">a person (SSO) or a role</text>
<text x="115" y="136" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#0f172a" font-weight="400" text-anchor="middle">used by an app</text>
<line x1="212" y1="100" x2="286" y2="100" stroke="#2563eb" stroke-width="2" marker-end="url(#ah-2563eb)"/>
<text x="250" y="90" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#2563eb" font-weight="400" text-anchor="middle">request</text>
<rect x="290" y="20" width="190" height="160" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="385" y="48" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#d97706" font-weight="700" text-anchor="middle">IAM policy check</text>
<text x="385" y="76" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#0f172a" font-weight="400" text-anchor="middle">Effect: Allow</text>
<text x="385" y="96" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#0f172a" font-weight="400" text-anchor="middle">Action: s3:GetObject</text>
<text x="385" y="116" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#0f172a" font-weight="400" text-anchor="middle">Resource: bucket/*</text>
<text x="385" y="146" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#dc2626" font-weight="600" text-anchor="middle">explicit Deny always wins</text>
<line x1="482" y1="100" x2="556" y2="100" stroke="#16a34a" stroke-width="2" marker-end="url(#ah-16a34a)"/>
<text x="520" y="90" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#16a34a" font-weight="400" text-anchor="middle">allowed</text>
<rect x="560" y="40" width="180" height="120" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="650" y="70" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#16a34a" font-weight="700" text-anchor="middle">Resource</text>
<text x="650" y="94" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle">what is touched</text>
<text x="650" y="120" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#0f172a" font-weight="400" text-anchor="middle">an S3 bucket, an EC2</text>
<text x="650" y="138" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#0f172a" font-weight="400" text-anchor="middle">instance, a database...</text>
<line x1="385" y1="182" x2="385" y2="232" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah-dc2626)"/>
<rect x="320" y="240" width="130" height="24" rx="12" fill="#dc2626"/><text x="385" y="257" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#ffffff" font-weight="600" text-anchor="middle">AccessDenied</text>
<text x="385" y="290" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#64748b" font-weight="400" text-anchor="middle">No matching Allow means denied: everything starts closed.</text>
<text x="385" y="310" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#64748b" font-weight="400" text-anchor="middle">Grant the smallest permission that gets the job done (least privilege).</text>
</svg>
