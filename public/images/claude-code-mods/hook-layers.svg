<rect x="120" y="176" width="520" height="174" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
<text x="136" y="202" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#64748b" font-weight="700" text-anchor="start">builtin · mods that ship inside Claude Code (/diff, AGENTS.md)</text>
<rect x="150" y="216" width="460" height="118" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
