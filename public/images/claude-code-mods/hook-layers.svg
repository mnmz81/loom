<text x="380" y="32" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#64748b" font-weight="400" text-anchor="middle">tool.call goes in with next(e), the result comes back out the same way</text>
