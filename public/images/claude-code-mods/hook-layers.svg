<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" role="img" aria-labelledby="t d">
<title id="t">The layers a mod event passes through</title>
<desc id="d">An event such as tool.call enters the outermost layer, the organization guard mods in prependPlugins. Each hook calls next(e) to pass it one layer in: the mods the user installed, then the organization defaults in appendPlugins, then the mods built into Claude Code, and finally Claude Code itself, which runs the tool. The result comes back out through the same layers. A hook that returns an answer without calling next stops the event at its layer.</desc>
