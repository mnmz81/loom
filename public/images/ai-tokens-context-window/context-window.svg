<svg xmlns="http://www.w3.org/2000/svg" width="760" height="190" viewBox="0 0 760 190" role="img" aria-labelledby="t d">
<title id="t">What fills the context window</title>
<desc id="d">The context window holds everything in one request: the system prompt, tool definitions, every earlier turn of the conversation, the new user message, and the answer the model writes, including thinking. When the total reaches the model limit, the request fails or the answer stops.</desc>
<defs><marker id="ah-f8fafc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f8fafc"/></marker><marker id="ah-cbd5e1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#cbd5e1"/></marker><marker id="ah-0f172a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f172a"/></marker><marker id="ah-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="ah-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker><marker id="ah-db2777" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#db2777"/></marker><marker id="ah-16a34a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16a34a"/></marker><marker id="ah-dc2626" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#dc2626"/></marker><marker id="ah-d97706" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d97706"/></marker><marker id="ah-94a3b8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker><marker id="ah-e2e8f0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e2e8f0"/></marker></defs>
<rect width="760" height="190" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="380" y="34" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#0f172a" font-weight="700" text-anchor="middle">One request = everything the model sees + what it writes</text>
<rect x="30" y="58" width="121" height="56" rx="6" fill="#2563eb" opacity="0.9"/>
<text x="90.5" y="91" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#ffffff" font-weight="600" text-anchor="middle">System prompt</text>
<rect x="155" y="58" width="131" height="56" rx="6" fill="#db2777" opacity="0.9"/>
<text x="220.5" y="91" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#ffffff" font-weight="600" text-anchor="middle">Tool definitions</text>
<rect x="290" y="58" width="86" height="56" rx="6" fill="#94a3b8" opacity="0.9"/>
<text x="333" y="91" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#ffffff" font-weight="600" text-anchor="middle">Turn 1</text>
<rect x="380" y="58" width="86" height="56" rx="6" fill="#94a3b8" opacity="0.9"/>
<text x="423" y="91" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#ffffff" font-weight="600" text-anchor="middle">Turn 2</text>
<rect x="470" y="58" width="96" height="56" rx="6" fill="#16a34a" opacity="0.9"/>
<text x="518" y="91" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#ffffff" font-weight="600" text-anchor="middle">New message</text>
<rect x="570" y="58" width="126" height="56" rx="6" fill="#d97706" opacity="0.9"/>
<text x="633" y="91" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#ffffff" font-weight="600" text-anchor="middle">Answer</text>
<rect x="30" y="58" width="700" height="56" rx="6" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="730" y="134" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="end">limit</text>
<text x="30" y="134" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">input tokens</text>
<text x="575" y="134" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#d97706" font-weight="400" text-anchor="start">output tokens</text>
<text x="380" y="168" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#64748b" font-weight="400" text-anchor="middle">Each new turn resends the whole history, so the window fills up as the conversation grows.</text>
</svg>
