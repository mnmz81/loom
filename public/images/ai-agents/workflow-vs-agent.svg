<svg xmlns="http://www.w3.org/2000/svg" width="760" height="260" viewBox="0 0 760 260" role="img" aria-labelledby="t d">
<title id="t">Workflow versus agent</title>
<desc id="d">In a workflow, your code fixes the path: step 1, step 2, step 3, each an LLM call. In an agent, the model chooses the next action in a loop: it acts with a tool, observes the result from the environment, and decides again until the task is done.</desc>
<defs><marker id="ah-f8fafc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f8fafc"/></marker><marker id="ah-cbd5e1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#cbd5e1"/></marker><marker id="ah-0f172a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f172a"/></marker><marker id="ah-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="ah-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker><marker id="ah-db2777" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#db2777"/></marker><marker id="ah-16a34a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16a34a"/></marker><marker id="ah-dc2626" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#dc2626"/></marker><marker id="ah-d97706" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d97706"/></marker><marker id="ah-94a3b8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker><marker id="ah-e2e8f0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e2e8f0"/></marker></defs>
<rect width="760" height="260" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="190" y="34" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#2563eb" font-weight="700" text-anchor="middle">Workflow: your code decides the path</text>
<rect x="30" y="70" width="95" height="50" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<text x="77" y="100" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#0f172a" font-weight="600" text-anchor="middle">Step 1</text>
<line x1="125" y1="95" x2="143" y2="95" stroke="#64748b" stroke-width="2" marker-end="url(#ah-64748b)"/>
<rect x="145" y="70" width="95" height="50" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<text x="192" y="100" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#0f172a" font-weight="600" text-anchor="middle">Step 2</text>
<line x1="240" y1="95" x2="258" y2="95" stroke="#64748b" stroke-width="2" marker-end="url(#ah-64748b)"/>
<rect x="260" y="70" width="95" height="50" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<text x="307" y="100" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#0f172a" font-weight="600" text-anchor="middle">Step 3</text>
<text x="190" y="160" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#64748b" font-weight="400" text-anchor="middle">Predictable, cheaper, easy to test.</text>
<line x1="390" y1="20" x2="390" y2="240" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="575" y="34" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#16a34a" font-weight="700" text-anchor="middle">Agent: the model decides the next step</text>
<rect x="500" y="60" width="150" height="44" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
<text x="575" y="87" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#0f172a" font-weight="600" text-anchor="middle">Model decides</text>
<rect x="420" y="150" width="120" height="44" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
<text x="480" y="177" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#0f172a" font-weight="600" text-anchor="middle">Act (tool)</text>
<rect x="610" y="150" width="120" height="44" rx="10" fill="#ffffff" stroke="#db2777" stroke-width="1.5"/>
<text x="670" y="177" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#0f172a" font-weight="600" text-anchor="middle">Observe result</text>
<line x1="530" y1="104" x2="491.31235742984956" y2="148.490788955673" stroke="#64748b" stroke-width="2" marker-end="url(#ah-64748b)"/>
<line x1="540" y1="172" x2="608" y2="172" stroke="#64748b" stroke-width="2" marker-end="url(#ah-64748b)"/>
<line x1="670" y1="150" x2="626.3985883109275" y2="105.4296680511703" stroke="#64748b" stroke-width="2" marker-end="url(#ah-64748b)"/>
<text x="575" y="230" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#64748b" font-weight="400" text-anchor="middle">Flexible, costs more, needs limits.</text>
</svg>
