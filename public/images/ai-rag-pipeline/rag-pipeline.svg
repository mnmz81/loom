<svg xmlns="http://www.w3.org/2000/svg" width="760" height="250" viewBox="0 0 760 250" role="img" aria-labelledby="t d">
<title id="t">The RAG pipeline</title>
<desc id="d">Indexing, done once: documents are split into chunks, each chunk is embedded, and the vectors are stored. Answering, for every question: the question is embedded, the closest chunks are retrieved from the vector store, and the question plus the chunks are sent to the LLM.</desc>
