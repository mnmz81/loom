<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="t d">
<title id="t">A frozen model inside an editable harness</title>
<desc id="d">Left: at run time the harness sends context to a frozen model, and the model answers with tool calls that the harness runs. The harness has five groups: context (prompt, tool docs, skills), state (memory, progress files), control (loop, limits, subagents), checks (guardrails, tests, sandbox) and extensions (tools, MCP, plugins). Right: the harness improves in a loop: run the agent on an eval set, read the traces, change one thing, and keep the change only if the score rises.</desc>
