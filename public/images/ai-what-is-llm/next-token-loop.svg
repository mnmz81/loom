<svg xmlns="http://www.w3.org/2000/svg" width="760" height="290" viewBox="0 0 760 290" role="img" aria-labelledby="t d">
<title id="t">The next-token loop</title>
<desc id="d">The model reads the text so far, produces a probability for every possible next token, one token is picked and appended to the text, and the loop repeats until the model emits a stop token or reaches the token limit.</desc>
<defs><marker id="ah-f8fafc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f8fafc"/></marker><marker id="ah-cbd5e1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#cbd5e1"/></marker><marker id="ah-0f172a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f172a"/></marker><marker id="ah-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="ah-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker><marker id="ah-db2777" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#db2777"/></marker><marker id="ah-16a34a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16a34a"/></marker><marker id="ah-dc2626" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#dc2626"/></marker><marker id="ah-d97706" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d97706"/></marker><marker id="ah-94a3b8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker><marker id="ah-e2e8f0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e2e8f0"/></marker></defs>
<rect width="760" height="290" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
<rect x="30" y="40" width="190" height="80" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<text x="125" y="70" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#2563eb" font-weight="700" text-anchor="middle">Text so far</text>
<text x="125" y="96" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#0f172a" font-weight="400" text-anchor="middle">The capital of France is</text>
<line x1="220" y1="80" x2="278" y2="80" stroke="#64748b" stroke-width="2" marker-end="url(#ah-64748b)"/>
<rect x="280" y="40" width="140" height="80" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="350" y="76" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#0f172a" font-weight="700" text-anchor="middle">Model</text>
<text x="350" y="98" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle">(a big function)</text>
<line x1="420" y1="80" x2="478" y2="80" stroke="#64748b" stroke-width="2" marker-end="url(#ah-64748b)"/>
<rect x="480" y="24" width="250" height="112" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
<text x="605" y="50" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#16a34a" font-weight="700" text-anchor="middle">Probability per next token</text>
<text x="520" y="78" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#0f172a" font-weight="400" text-anchor="start">Paris</text>
