<text x="722" y="78" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="end">92%</text>
<text x="520" y="102" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#0f172a" font-weight="400" text-anchor="start">Lyon</text>
