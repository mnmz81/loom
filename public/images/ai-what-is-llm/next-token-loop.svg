<text x="722" y="102" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="end">3%</text>
<text x="520" y="126" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#0f172a" font-weight="400" text-anchor="start">France</text>
<rect x="590" y="115" width="3" height="12" rx="3" fill="#16a34a"/>
<text x="722" y="126" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="end">2%</text>
<line x1="605" y1="136" x2="605" y2="188" stroke="#64748b" stroke-width="2" marker-end="url(#ah-64748b)"/>
<rect x="480" y="190" width="250" height="56" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
<text x="605" y="214" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#d97706" font-weight="700" text-anchor="middle">Pick one token</text>
<text x="605" y="234" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#0f172a" font-weight="400" text-anchor="middle">" Paris"</text>
<line x1="480" y1="218" x2="127" y2="218" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah-64748b)"/>
<line x1="125" y1="218" x2="125" y2="126" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah-64748b)"/>
<text x="300" y="208" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#64748b" font-weight="400" text-anchor="middle">append to the text and repeat</text>
<text x="380" y="274" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#64748b" font-weight="400" text-anchor="middle">Stops at a stop token or at max_tokens</text>
