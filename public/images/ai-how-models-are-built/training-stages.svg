<svg xmlns="http://www.w3.org/2000/svg" width="760" height="220" viewBox="0 0 760 220" role="img" aria-labelledby="t d">
<title id="t">How a chat model is trained</title>
<desc id="d">Three stages: pretraining on huge amounts of text produces a base model that continues text; supervised fine-tuning on example conversations teaches it to follow instructions; preference training such as RLHF, DPO or Constitutional AI teaches it which answers are better, producing an assistant.</desc>
<defs><marker id="ah-f8fafc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f8fafc"/></marker><marker id="ah-cbd5e1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#cbd5e1"/></marker><marker id="ah-0f172a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f172a"/></marker><marker id="ah-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="ah-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker><marker id="ah-db2777" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#db2777"/></marker><marker id="ah-16a34a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16a34a"/></marker><marker id="ah-dc2626" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#dc2626"/></marker><marker id="ah-d97706" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d97706"/></marker><marker id="ah-94a3b8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker><marker id="ah-e2e8f0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e2e8f0"/></marker></defs>
<rect width="760" height="220" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
<rect x="30" y="30" width="200" height="110" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<text x="130" y="60" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#2563eb" font-weight="700" text-anchor="middle">Pretraining</text>
<text x="130" y="88" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#0f172a" font-weight="400" text-anchor="middle">huge amounts of text</text>
<text x="130" y="108" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#64748b" font-weight="400" text-anchor="middle">predict the next token</text>
<text x="130" y="180" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#0f172a" font-weight="700" text-anchor="middle">→ base model</text>
<line x1="130" y1="140" x2="130" y2="162" stroke="#2563eb" stroke-width="2" marker-end="url(#ah-2563eb)"/>
<line x1="230" y1="85" x2="278" y2="85" stroke="#64748b" stroke-width="2" marker-end="url(#ah-64748b)"/>
<rect x="280" y="30" width="200" height="110" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
<text x="380" y="60" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#16a34a" font-weight="700" text-anchor="middle">Fine-tuning (SFT)</text>
<text x="380" y="88" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#0f172a" font-weight="400" text-anchor="middle">example conversations</text>
<text x="380" y="108" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#64748b" font-weight="400" text-anchor="middle">written by people</text>
<text x="380" y="180" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#0f172a" font-weight="700" text-anchor="middle">→ follows instructions</text>
<line x1="380" y1="140" x2="380" y2="162" stroke="#16a34a" stroke-width="2" marker-end="url(#ah-16a34a)"/>
<line x1="480" y1="85" x2="528" y2="85" stroke="#64748b" stroke-width="2" marker-end="url(#ah-64748b)"/>
<rect x="530" y="30" width="200" height="110" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
<text x="630" y="60" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#d97706" font-weight="700" text-anchor="middle">Preference training</text>
<text x="630" y="88" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#0f172a" font-weight="400" text-anchor="middle">RLHF, DPO, Constitutional AI</text>
<text x="630" y="108" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#64748b" font-weight="400" text-anchor="middle">better answer vs worse</text>
<text x="630" y="180" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#0f172a" font-weight="700" text-anchor="middle">→ assistant</text>
<line x1="630" y1="140" x2="630" y2="162" stroke="#d97706" stroke-width="2" marker-end="url(#ah-d97706)"/>
<text x="380" y="208" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#64748b" font-weight="400" text-anchor="middle">Most of the knowledge comes from stage 1; stages 2 and 3 shape behavior.</text>
</svg>
