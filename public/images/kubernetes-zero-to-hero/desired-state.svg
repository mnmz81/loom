<text x="95" y="142" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#0f172a" font-weight="700" text-anchor="middle">You</text>
<text x="95" y="164" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle">kubectl apply</text>
<text x="95" y="182" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#2563eb" font-weight="400" text-anchor="middle">replicas: 3</text>
