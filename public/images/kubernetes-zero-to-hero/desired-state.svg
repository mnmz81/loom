<rect x="430" y="28" width="100" height="24" rx="12" fill="#d97706"/><text x="480" y="45" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#ffffff" font-weight="600" text-anchor="middle">compare</text>
<rect x="400" y="254" width="160" height="24" rx="12" fill="#d97706"/><text x="480" y="271" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#ffffff" font-weight="600" text-anchor="middle">act: start 1 Pod</text>
<text x="475" y="160" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#d97706" font-weight="700" text-anchor="middle">controller</text>
<text x="475" y="180" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle">loops forever</text>
<text x="380" y="306" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#64748b" font-weight="400" text-anchor="middle">Desired 3, actual 2: the controller starts a Pod. You never say how, only what.</text>
