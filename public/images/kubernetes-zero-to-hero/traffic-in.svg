<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390" role="img" aria-labelledby="t d">
<title id="t">How traffic reaches Pods</title>
<desc id="d">A user on the internet reaches a load balancer or a Gateway, which routes by hostname and path to a Service, which spreads requests across Pods. A ClusterIP Service is reachable only inside the cluster. A NodePort Service opens the same port on every node. A LoadBalancer Service asks the cloud for an external load balancer. For local testing, kubectl port-forward tunnels a port from your computer.</desc>
