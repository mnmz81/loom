<text x="180" y="273" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#0f172a" font-weight="400" text-anchor="start">default. A stable IP and DNS name inside the cluster only.</text>
<rect x="35" y="286" width="130" height="24" rx="12" fill="#d97706"/><text x="100" y="303" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#ffffff" font-weight="600" text-anchor="middle">NodePort</text>
