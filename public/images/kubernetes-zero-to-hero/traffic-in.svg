<rect x="35" y="316" width="130" height="24" rx="12" fill="#2563eb"/><text x="100" y="333" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#ffffff" font-weight="600" text-anchor="middle">LoadBalancer</text>
<text x="180" y="333" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#0f172a" font-weight="400" text-anchor="start">also asks the cloud provider for an external load balancer.</text>
<text x="380" y="370" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#64748b" font-weight="400" text-anchor="middle">On your laptop:  kubectl port-forward svc/hello 8080:80</text>
