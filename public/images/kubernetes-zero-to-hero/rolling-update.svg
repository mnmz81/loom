<rect x="152" y="274" width="76" height="40" rx="10" fill="#16a34a" stroke="#16a34a" stroke-width="2"/><text x="190" y="299" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="middle">v2</text>
