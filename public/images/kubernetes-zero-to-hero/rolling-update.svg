<text x="380" y="352" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#64748b" font-weight="400" text-anchor="middle">Each new Pod must pass its readiness probe before an old one is removed.</text>
