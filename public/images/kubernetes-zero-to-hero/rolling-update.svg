<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" role="img" aria-labelledby="t d">
<title id="t">A rolling update from v1 to v2</title>
<desc id="d">A Deployment with three replicas of v1 is updated to v2. Kubernetes starts one v2 Pod, waits until it is ready, then removes one v1 Pod, and repeats until all three run v2. Traffic keeps flowing the whole time. If v2 never becomes ready, the rollout stops and kubectl rollout undo goes back to v1.</desc>
