<rect x="20" y="40" width="170" height="80" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<text x="105" y="72" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#2563eb" font-weight="700" text-anchor="middle">Deployment</text>
<text x="105" y="94" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle">hello, replicas: 3</text>
