<rect x="250" y="40" width="170" height="80" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
<text x="335" y="72" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#64748b" font-weight="700" text-anchor="middle">ReplicaSet</text>
<text x="335" y="94" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle">keeps 3 running</text>
