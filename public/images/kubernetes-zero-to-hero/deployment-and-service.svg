<rect x="590" y="40" width="150" height="80" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
<text x="665" y="72" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#16a34a" font-weight="700" text-anchor="middle">Service</text>
<text x="665" y="94" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle">hello:80</text>
<line x1="630" y1="122" x2="501.6325424234098" y2="212.84466228497152" stroke="#16a34a" stroke-width="2" marker-end="url(#ah-16a34a)"/>
<line x1="625" y1="122" x2="381.87234410399105" y2="213.29691568339928" stroke="#16a34a" stroke-width="2" marker-end="url(#ah-16a34a)"/>
<line x1="620" y1="122" x2="261.93772557182444" y2="213.5048034649782" stroke="#16a34a" stroke-width="2" marker-end="url(#ah-16a34a)"/>
<text x="596" y="180" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#16a34a" font-weight="400" text-anchor="start">selector: app=hello</text>
<text x="105" y="160" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#2563eb" font-weight="400" text-anchor="middle">You edit this one.</text>
<text x="105" y="178" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#2563eb" font-weight="400" text-anchor="middle">It creates the rest.</text>
<text x="380" y="322" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#64748b" font-weight="400" text-anchor="middle">Pods come and go with new IPs. The Service finds them by label and keeps one stable name.</text>
