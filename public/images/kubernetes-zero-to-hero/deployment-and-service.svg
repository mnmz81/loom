<text x="380" y="280" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#db2777" font-weight="400" text-anchor="middle">label  app: hello</text>
<rect x="222" y="216" width="76" height="40" rx="10" fill="#db2777" stroke="#db2777" stroke-width="2"/><text x="260" y="241" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="middle">Pod</text>
