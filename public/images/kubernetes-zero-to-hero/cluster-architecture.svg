<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" role="img" aria-labelledby="t d">
<title id="t">The parts of a Kubernetes cluster</title>
<desc id="d">kubectl on your computer talks to the API server. The control plane holds the API server, etcd where the cluster state is stored, the scheduler that places Pods on nodes, and the controller manager that runs the controllers. Each worker node runs a kubelet, kube-proxy and a container runtime, and the Pods with your containers.</desc>
