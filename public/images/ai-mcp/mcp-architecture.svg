<title id="t">MCP architecture</title>
<desc id="d">A host application such as an IDE or chat app runs one MCP client per server. Each client talks to exactly one server over JSON-RPC, using stdio for local servers or Streamable HTTP for remote ones. Servers expose tools, resources and prompts.</desc>
