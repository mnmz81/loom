<svg xmlns="http://www.w3.org/2000/svg" width="760" height="270" viewBox="0 0 760 270" role="img" aria-labelledby="t d">
<title id="t">The tool use loop</title>
<desc id="d">Your app sends the messages and the tool definitions to the model. If the model answers with stop_reason tool_use, your code runs the requested tool and sends the result back as a tool_result in a new user message. The loop repeats until the model answers with end_turn.</desc>
<defs><marker id="ah-f8fafc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f8fafc"/></marker><marker id="ah-cbd5e1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#cbd5e1"/></marker><marker id="ah-0f172a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f172a"/></marker><marker id="ah-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="ah-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker><marker id="ah-db2777" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#db2777"/></marker><marker id="ah-16a34a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16a34a"/></marker><marker id="ah-dc2626" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#dc2626"/></marker><marker id="ah-d97706" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d97706"/></marker><marker id="ah-94a3b8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker><marker id="ah-e2e8f0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e2e8f0"/></marker></defs>
<rect width="760" height="270" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
<rect x="30" y="40" width="200" height="90" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<text x="130" y="72" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#2563eb" font-weight="700" text-anchor="middle">Your app</text>
<text x="130" y="96" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#0f172a" font-weight="400" text-anchor="middle">messages + tools</text>
<rect x="530" y="40" width="200" height="90" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
<text x="630" y="72" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#16a34a" font-weight="700" text-anchor="middle">Model</text>
<text x="630" y="96" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#0f172a" font-weight="400" text-anchor="middle">decides: answer or call</text>
<line x1="230" y1="70" x2="528" y2="70" stroke="#2563eb" stroke-width="2" marker-end="url(#ah-2563eb)"/>
<text x="380" y="60" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#64748b" font-weight="400" text-anchor="middle">request</text>
<line x1="530" y1="105" x2="232" y2="105" stroke="#16a34a" stroke-width="2" marker-end="url(#ah-16a34a)"/>
<text x="390" y="150" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#16a34a" font-weight="400" text-anchor="middle">stop_reason: "tool_use"  +  tool_use block</text>
<rect x="30" y="170" width="200" height="70" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
<text x="130" y="198" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#d97706" font-weight="700" text-anchor="middle">Run the tool</text>
<text x="130" y="220" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle">your code, your rules</text>
<line x1="130" y1="130" x2="130" y2="168" stroke="#d97706" stroke-width="2" marker-end="url(#ah-d97706)"/>
<line x1="230" y1="205" x2="630" y2="205" stroke="#d97706" stroke-width="2" stroke-dasharray="6 4"/>
<line x1="630" y1="205" x2="630" y2="132" stroke="#d97706" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah-d97706)"/>
<text x="430" y="226" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#d97706" font-weight="400" text-anchor="middle">tool_result → next request</text>
<text x="380" y="258" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#64748b" font-weight="400" text-anchor="middle">Repeats until stop_reason: "end_turn"</text>
</svg>
