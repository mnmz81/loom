<div class="container page page-narrow">
  <header class="page__header">
    <h1 class="page__title">{{ title() }}</h1>
    @if (topTags().length) {
      <ul class="chips" [attr.aria-label]="locale.t('entry.tags')">
        @for (tag of topTags(); track tag.tag) {
          <li>
            <a muiChip [routerLink]="tagPath(tag.tag)">{{ tag.label }}</a>
          </li>
        }
      </ul>
      @if (moreTags().length) {
        <mui-accordion-item class="more-tags" [heading]="locale.t('list.moreTags', { n: moreTags().length })">
          <ul class="chips">
            @for (tag of moreTags(); track tag.tag) {
              <li>
                <a muiChip [routerLink]="tagPath(tag.tag)">{{ tag.label }}</a>
              </li>
            }
          </ul>
        </mui-accordion-item>
      }
    }
  </header>

  <nb-entry-list [entries]="pageEntries()" [tagLabels]="tagLabels()" />

  @if (pageCount() > 1) {
    <mui-pagination
      class="pager"
      [page]="page()"
      [totalPages]="pageCount()"
      [hrefFor]="pageHref"
      [ariaLabel]="locale.t('pager.label')"
      [previousLabel]="locale.t('pager.prev')"
      [nextLabel]="locale.t('pager.next')"
      [pageLabel]="pageLabel"
    />
  }
</div>
