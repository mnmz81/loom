<nav class="series-nav" [attr.aria-label]="label()">
  <p class="series-nav__header">
    <a class="series-nav__title" [routerLink]="seriesPath()">{{ nav().title }}</a>
    <span class="series-nav__part">{{ part() }}</span>
  </p>

  @if (nav().prev || nav().next) {
    <ul class="series-nav__links">
      @if (nav().prev; as prev) {
        <li class="series-nav__item series-nav__item--prev">
          <a
            class="series-nav__link"
            rel="prev"
            [routerLink]="path(prev)"
            [attr.hreflang]="foreignLang(prev)"
          >
            <span class="series-nav__dir">
              <svg
                class="series-nav__arrow"
                viewBox="0 0 24 24"
                width="16"
                height="16"
                aria-hidden="true"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M19 12H5M11 6l-6 6 6 6" />
              </svg>
              {{ locale.t('series.prev') }}
            </span>
            <span
              class="series-nav__ref"
              [attr.lang]="foreignLang(prev)"
              [attr.dir]="foreignDir(prev)"
              >{{ prev.title }}</span
            >
          </a>
        </li>
      }
      @if (nav().next; as next) {
        <li class="series-nav__item series-nav__item--next">
          <a
            class="series-nav__link"
            rel="next"
            [routerLink]="path(next)"
            [attr.hreflang]="foreignLang(next)"
          >
            <span class="series-nav__dir">
              {{ locale.t('series.next') }}
              <svg
                class="series-nav__arrow"
                viewBox="0 0 24 24"
                width="16"
                height="16"
                aria-hidden="true"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M5 12h14M13 6l6 6-6 6" />
              </svg>
            </span>
            <span
              class="series-nav__ref"
              [attr.lang]="foreignLang(next)"
              [attr.dir]="foreignDir(next)"
              >{{ next.title }}</span
            >
          </a>
        </li>
      }
    </ul>
  }
</nav>
