@if (compact()) {
  <!-- One line at the top of a post: series, position, small prev/next arrows. Full links stay at the end. -->
  <span class="series-bar">
    <a class="series-bar__title" [routerLink]="seriesPath()">{{ nav().title }}</a>
    <span class="series-bar__part">{{ part() }}</span>
    <span class="series-bar__steps">
      @if (nav().prev; as prev) {
        <a
          class="series-bar__step"
          [routerLink]="path(prev)"
          [attr.hreflang]="foreignLang(prev)"
          [attr.aria-label]="locale.t('series.prev') + ': ' + prev.title"
          [attr.title]="prev.title"
        >
          <mui-icon class="series-nav__arrow" name="chevron-left" size="sm" mirror />
        </a>
      }
      @if (nav().next; as next) {
        <a
          class="series-bar__step"
          [routerLink]="path(next)"
          [attr.hreflang]="foreignLang(next)"
          [attr.aria-label]="locale.t('series.next') + ': ' + next.title"
          [attr.title]="next.title"
        >
          <mui-icon class="series-nav__arrow" name="chevron-right" size="sm" mirror />
        </a>
      }
    </span>
  </span>
} @else {
  <nav class="series-nav" [attr.aria-label]="label()">
    <p class="series-nav__header">
      <a class="series-nav__title" [routerLink]="seriesPath()">{{ nav().title }}</a>
      <span class="series-nav__part">{{ part() }}</span>
    </p>

    @if (nav().prev || nav().next) {
      <mui-pager class="series-nav__pager" [label]="locale.t('series.title')">
        @if (nav().prev; as prev) {
          <a
            muiPagerLink
            direction="previous"
            [directionLabel]="locale.t('series.prev')"
            [routerLink]="path(prev)"
            [attr.hreflang]="foreignLang(prev)"
          >
            <span class="series-nav__ref" [attr.lang]="foreignLang(prev)" [attr.dir]="foreignDir(prev)">{{
              prev.title
            }}</span>
          </a>
        }
        @if (nav().next; as next) {
          <a
            muiPagerLink
            direction="next"
            [directionLabel]="locale.t('series.next')"
            [routerLink]="path(next)"
            [attr.hreflang]="foreignLang(next)"
          >
            <span class="series-nav__ref" [attr.lang]="foreignLang(next)" [attr.dir]="foreignDir(next)">{{
              next.title
            }}</span>
          </a>
        }
      </mui-pager>
    }
  </nav>
}
