<mui-site-header
  class="site-header"
  [(open)]="menuOpen"
  [menuLabel]="locale.t('nav.menu')"
  [navLabel]="locale.t('nav.main')"
>
  <a slot="brand" class="site-header__brand" [routerLink]="homePath()" (click)="closeMenu()">
    <span class="site-header__name">{{ siteTitle() }}</span>
  </a>

  <div slot="actions" class="site-header__actions">
    <a
      muiButton
      variant="secondary"
      size="sm"
      class="site-header__lang"
      [routerLink]="switchUrl()"
      [attr.hreflang]="otherLang()"
      [attr.lang]="otherLang()"
      [attr.title]="locale.t('lang.switch')"
      (click)="closeMenu()"
      >{{ otherLangName() }}</a
    >
    <button
      muiButton
      variant="ghost"
      size="sm"
      type="button"
      class="site-header__theme-btn"
      [attr.aria-label]="themeLabel()"
      [attr.title]="themeLabel()"
      (click)="themeToggle.emit()"
    >
      <mui-icon [name]="theme() === 'dark' ? 'sun' : 'moon'" />
    </button>
  </div>

  <!-- The library header closes the menu on a link click and on Escape, and returns focus to its button. -->
  <ul class="site-header__links">
    @for (link of links(); track link.key) {
      <li>
        <a
          muiNavLink
          [routerLink]="link.path"
          [active]="link.active()"
          [attr.aria-keyshortcuts]="link.shortcut ?? null"
          >{{ locale.t(link.key) }}</a
        >
      </li>
    }
  </ul>
</mui-site-header>
