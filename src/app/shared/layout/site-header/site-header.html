<header class="site-header" [class.site-header--open]="menuOpen()">
  <div class="container site-header__inner">
    <a class="site-header__brand" [routerLink]="homePath()" (click)="closeMenu()">
      <span class="site-header__name">{{ siteTitle() }}</span>
    </a>

    <button
      #menuButton
      muiButton
      variant="ghost"
      size="sm"
      type="button"
      class="site-header__menu-btn"
      aria-controls="nb-site-nav"
      [attr.aria-expanded]="menuOpen()"
      [attr.aria-label]="locale.t('nav.menu')"
      (click)="toggleMenu()"
    >
      <mui-icon [name]="menuOpen() ? 'x' : 'menu'" />
    </button>

    <nav id="nb-site-nav" class="site-header__nav" [attr.aria-label]="locale.t('nav.main')">
      <ul class="site-header__links">
        @for (link of links(); track link.key) {
          <li>
            <a
              muiNavLink
              [routerLink]="link.path"
              [active]="link.active()"
              [attr.aria-keyshortcuts]="link.shortcut ?? null"
              (click)="closeMenu()"
              >{{ locale.t(link.key) }}</a
            >
          </li>
        }
      </ul>
    </nav>

    <div class="site-header__actions">
      <a
        muiButton
        variant="secondary"
        size="sm"
        class="site-header__lang"
        [routerLink]="switchUrl()"
        [attr.hreflang]="otherLang()"
        [attr.lang]="otherLang()"
        [attr.title]="locale.t('lang.switch')"
        (click)="closeMenu()"
        >{{ otherLangName() }}</a
      >
      <button
        muiButton
        variant="ghost"
        size="sm"
        type="button"
        class="site-header__theme-btn"
        [attr.aria-label]="themeLabel()"
        [attr.title]="themeLabel()"
        (click)="themeToggle.emit()"
      >
        @if (theme() === 'dark') {
          <svg
            viewBox="0 0 24 24"
            width="20"
            height="20"
            aria-hidden="true"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          >
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
            />
          </svg>
        } @else {
          <svg
            viewBox="0 0 24 24"
            width="20"
            height="20"
            aria-hidden="true"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
          </svg>
        }
      </button>
    </div>
  </div>
</header>
