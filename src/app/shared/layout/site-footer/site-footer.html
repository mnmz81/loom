<footer class="site-footer">
  <div class="container site-footer__top">
    <p class="site-footer__about">{{ locale.t('footer.about') }}</p>
    <nav [attr.aria-label]="locale.t('footer.sections')">
      <ul class="site-footer__sections">
        @for (section of sections(); track section.key) {
          <li>
            <a muiNavLink size="sm" class="site-footer__section" [routerLink]="section.path">{{ locale.t(section.key) }}</a>
          </li>
        }
      </ul>
    </nav>
  </div>
  <div class="container site-footer__inner">
    <p class="site-footer__copy">
      © {{ year }} <span lang="en">{{ author }}</span>
    </p>
    <ul class="site-footer__links">
      <li>
        <a muiNavLink size="sm" class="site-footer__link" [routerLink]="accessibilityPath()">{{ locale.t('footer.accessibility') }}</a>
      </li>
      <li>
        <a muiNavLink size="sm" class="site-footer__link" [href]="rssHref()" type="application/rss+xml">
          <mui-icon name="rss" size="sm" />
          {{ locale.t('footer.rss') }}
        </a>
      </li>
      <li>
        <a muiNavLink size="sm" class="site-footer__link" [href]="repo">
          <mui-icon name="github" size="sm" />
          {{ locale.t('footer.source') }}
        </a>
      </li>
    </ul>
  </div>
</footer>
