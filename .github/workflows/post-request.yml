name: Post request

# Writes a blog post with Claude Code (anthropics/claude-code-action, tag mode):
# - an issue gets the post-request label (opened from /admin/request.html) → Claude writes the post
#   with the new-post skill on a claude/… branch and replies with a link to open the PR;
# - "@claude …" in a comment on that issue or its PR → Claude revises the branch.
# Only the repository owner can trigger it (the action also requires write access). Setup: docs/post-requests.md
# Tools are limited to the exact npm scripts the new-post skill needs, the diagram scripts, and python3
# (to run the post's examples). python3 can run any code, so a hostile page fetched while researching
# could try a prompt injection: keep branch protection on main and review every PR before merging.

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write   # the action exchanges the OIDC token for a short-lived Claude GitHub app token

concurrency:
  group: post-request-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: >-
      github.actor == github.repository_owner && (
        (github.event_name == 'issues' && github.event.label.name == 'post-request') ||
        (github.event_name != 'issues' && contains(github.event.comment.body, '@claude'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Hebrew glyphs for the OG image (scripts/og/fonts.ts looks for DejaVu on Linux).
      - name: Ensure Hebrew font
        run: |
          [ -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf ] || {
            sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-dejavu-core
          }

      # Pinned to a commit (v1.0.248). To update: gh api repos/anthropics/claude-code-action/git/ref/tags/<tag>
      # → dereference the tag object to its commit SHA, and read the release notes first.
      - uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          label_trigger: post-request
          claude_args: |
            --model claude-opus-5-5
            --max-turns 200
            --allowedTools "Read,Write,Edit,Glob,Grep,WebFetch,WebSearch,Bash(npm run new-post:*),Bash(npm run content),Bash(npm run build),Bash(npm run test:scripts),Bash(npx tsx scripts/diagrams/*),Bash(python3:*)"
