name: Post request

# Writes a blog post with Claude Code (anthropics/claude-code-action, tag mode):
# - an issue gets the post-request label (opened from /admin/request.html) → Claude writes the post
#   with the new-post skill on a claude/… branch and replies with a link to open the PR;
# - "@claude …" in a comment on that issue or its PR → Claude revises the branch.
# Only the repository owner can trigger it (the action also requires write access). Setup: docs/post-requests.md

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: post-request-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: >-
      github.actor == github.repository_owner && (
        (github.event_name == 'issues' && github.event.label.name == 'post-request') ||
        (github.event_name != 'issues' && contains(github.event.comment.body, '@claude'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Hebrew glyphs for the OG image (scripts/og/fonts.ts looks for DejaVu on Linux).
      - name: Ensure Hebrew font
        run: |
          [ -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf ] || {
            sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-dejavu-core
          }

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          label_trigger: post-request
          claude_args: |
            --model claude-opus-5-5
            --max-turns 200
            --allowedTools "Read,Write,Edit,Glob,Grep,WebFetch,WebSearch,Bash(./scripts/with-node.sh:*),Bash(npm run:*),Bash(npx tsx:*),Bash(python3:*),Bash(ls:*),Bash(wc:*)"
