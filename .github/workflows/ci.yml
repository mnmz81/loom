name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Script tests
        run: npm run test:scripts

      - name: Unit tests
        run: npm test

      # Hebrew glyphs for the OG image (scripts/og/fonts.ts looks for DejaVu on Linux).
      - name: Ensure Hebrew font
        run: |
          [ -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf ] || {
            sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-dejavu-core
          }

      # content → og → ng build → postbuild (404, Pagefind, output check)
      - name: Build
        run: npm run build
        env:
          OG_REQUIRE_HEBREW: '1'

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npm run e2e
        env:
          CI: 'true'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
