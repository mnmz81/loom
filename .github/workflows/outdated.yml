name: Outdated packages

# Reports npm updates in one issue instead of Dependabot version-update PRs.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: outdated
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # @mushilu-san/ui is a private package of another owner: GITHUB_TOKEN cannot read it.
      - uses: ./.github/actions/setup
        with:
          token: ${{ secrets.PACKAGES_READ_TOKEN }}
          ignore-scripts: 'true'

      - run: ./scripts/outdated-issue.sh
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
          GH_TOKEN: ${{ github.token }}
