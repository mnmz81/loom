title:
  he: Angular מההתחלה ועד מומחה
  en: Angular from beginner to expert
description:
  he: סדרת פוסטים קצרים על Angular 22, נושא בכל פוסט, מהקומפוננטה הראשונה ועד ארכיטקטורה וביצועים. כל פוסט מראה גם איך עשו את אותו דבר בגרסאות קודמות. כל טענה נבדקה מול angular.dev.
  en: Short posts on Angular 22, one topic each, from the first component to architecture and performance. Each post also shows how the same thing was done in older versions. Every claim checked against angular.dev.
